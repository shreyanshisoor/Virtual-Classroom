services:
  - type: web
    name: virtual-classroom
    env: node
    buildCommand: cd backend && npm install && npx prisma migrate deploy && node seed.js
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-classroom-db
          property: connectionString
    autoDeploy: true
    healthCheckPath: /ws-health

databases:
  - name: virtual-classroom-db
    region: oregon
    postgresVersion: 15