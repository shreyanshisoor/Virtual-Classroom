services:
  - type: web
    name: virtual-classroom
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node start.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-classroom-db
          property: connectionString
      - key: NODE_ENV
        value: production
    autoDeploy: true
    healthCheckPath: /ws-health
    timeout: 300

databases:
  - name: virtual-classroom-db
    region: ohio
    postgresVersion: 15